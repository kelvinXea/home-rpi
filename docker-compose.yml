# Entorno Docker de home-rpi. Uso: cp .env.example .env && docker compose up -d --build --wait
# Solo `web` publica puertos; `api` es accesible únicamente a través del proxy /api/.
name: home-rpi

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: home-rpi-api:local
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/home-rpi.sqlite
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Volumen con nombre montado como DIRECTORIO (SQLite en WAL crea -wal/-shm).
      - api-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: home-rpi-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_MENU_PORT:-8080}:8080"
      - "${WEB_VPN_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  api-data:
