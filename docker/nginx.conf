# Un server por frontend (puertos internos 8080 y 8081); ambos proxifican /api/.
server_tokens off;

server {
    listen 8080;
    root /usr/share/nginx/html/menu;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8081;
    root /usr/share/nginx/html/vpn;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
